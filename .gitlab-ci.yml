# Pipeline CI/CD PrograMemo — LaForgeEdu (GitLab, apps.education.fr)
#
# 1) "test"          : lance la suite pytest (client Grist simulé, aucun
#                       appel réseau réel) — bloque la suite si elle échoue.
# 2) "build_image"    : construit l'image Docker de l'API et la pousse sur
#                        Docker Hub. Nécessaire car Render ne sait PAS
#                        construire directement depuis une instance GitLab
#                        auto-hébergée (seuls github.com, gitlab.com et
#                        Bitbucket sont supportés en connexion directe) —
#                        on passe donc par une image Docker, que Render sait
#                        déployer depuis n'importe quel registre courant.
# 3) "deploy_render"  : déclenche un nouveau déploiement sur Render via son
#                        Deploy Hook, qui va re-tirer l'image "latest".
# 4) "pages"           : publie programemo_app.html en tant que page
#                         statique GitLab Pages.
#
# Variables CI/CD à définir dans Settings > CI/CD > Variables de ce projet
# (jamais en clair ici) :
#   DOCKERHUB_USERNAME       votre identifiant Docker Hub
#   DOCKERHUB_TOKEN           un Access Token Docker Hub (PAS votre mot de
#                              passe — Docker Hub > Account Settings >
#                              Security > New Access Token, droits
#                              Read & Write). Type Variable, Protected, Masked.
#   RENDER_DEPLOY_HOOK_URL    URL du Deploy Hook Render (Settings > Deploy
#                              Hook du service). Type Variable, Protected, Masked.

stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_NAME: "$DOCKERHUB_USERNAME/programemo-backend"
  # Le service "docker:24-dind" fait tourner le démon Docker dans un
  # conteneur séparé, joignable sur le réseau interne du job sous le nom
  # d'hôte "docker" — sans DOCKER_HOST, le client docker cherche par défaut
  # un démon local (unix:///var/run/docker.sock), qui n'existe pas ici, d'où
  # l'erreur "Cannot connect to the Docker daemon" constatée en pratique.
  # TLS désactivé entre "build" et le service "docker" : sur l'exécuteur
  # Kubernetes de LaForgeEdu, le volume "/certs" censé être partagé entre les
  # deux conteneurs du même pod ne l'est pas de façon fiable, ce qui produit
  # "open /certs/client/ca.pem: no such file or directory" avec TLS activé.
  # Les deux conteneurs étant de toute façon isolés dans le même pod, le
  # canal non chiffré (port 2375) est sans risque ici.
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11
  script:
    - pip install --cache-dir="$PIP_CACHE_DIR" -r requirements.txt
    - pip install --cache-dir="$PIP_CACHE_DIR" pytest httpx
    # "python -m pytest" (et non "pytest" seul) : ajoute automatiquement le
    # dossier courant (donc le package "app") au chemin de recherche des
    # modules Python — sans quoi l'import "from app import ..." échoue avec
    # ModuleNotFoundError dans cet environnement CI (constaté en pratique).
    - python -m pytest tests/ -v

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs: ["test"]
  only:
    - main
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

deploy_render:
  stage: deploy
  image: alpine:3.19
  needs: ["build_image"]
  only:
    - main
  script:
    - apk add --no-cache curl
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

pages:
  stage: deploy
  image: alpine:3.19
  needs: []
  only:
    - main
  script:
    - mkdir -p public
    - cp programemo_app.html public/index.html
  artifacts:
    paths:
      - public
